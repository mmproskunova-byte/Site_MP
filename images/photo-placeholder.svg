<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-label="Заглушка для фото Марины Проскуновой">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7EEDD"/>
      <stop offset="1" stop-color="#EFE1C9"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- абстрактный силуэт: нейтральная заглушка вместо фото -->
  <circle cx="200" cy="205" r="62" fill="none" stroke="#B4823A" stroke-width="2.5" opacity="0.75"/>
  <path d="M96 420c0-58 46-104 104-104s104 46 104 104" fill="none" stroke="#B4823A" stroke-width="2.5" opacity="0.75" stroke-linecap="round"/>

  <!-- тонкие декоративные линии -->
  <line x1="40" y1="40" x2="88" y2="40" stroke="#B4823A" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="40" x2="40" y2="88" stroke="#B4823A" stroke-width="2" opacity="0.6"/>
  <line x1="360" y1="460" x2="312" y2="460" stroke="#B4823A" stroke-width="2" opacity="0.6"/>
  <line x1="360" y1="460" x2="360" y2="412" stroke="#B4823A" stroke-width="2" opacity="0.6"/>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#6F6151">Фото будет позже</text>
  <text x="200" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#8B7A64">ЗАГЛУШКА · 4:5</text>
</svg>
